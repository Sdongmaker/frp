version: '3.8'

services:
  frpc:
    image: connecttotheimmortal/frpc:latest
    container_name: frpc
    restart: always
    environment:
      # 服务端连接
      FRP_SERVER_ADDR: "your.server.ip"
      FRP_SERVER_PORT: "7000"
      FRP_TOKEN: "your_token_here"
      # 穿透代理（支持多个，按 FRP_PROXY_N 顺序加载）
      # 格式: 名称,类型,本地IP,本地端口,远程端口
      # 类型支持: tcp / udp / http / https
      # 远程端口为服务端暴露的端口，客户端访问 <服务端IP>:<远程端口> 即可到达本地服务
      FRP_PROXY_1: "ssh,tcp,127.0.0.1,22,6000"
      FRP_PROXY_2: "web,tcp,127.0.0.1,80,8080"
      # FRP_PROXY_3: "rdp,tcp,127.0.0.1,3389,3389"
    entrypoint:
      - sh
      - -c
      - |
        cat > /tmp/frpc.toml <<EOF
        serverAddr = "$$FRP_SERVER_ADDR"
        serverPort = $$FRP_SERVER_PORT
        auth.method = "token"
        auth.token = "$$FRP_TOKEN"
        EOF
        for proxy in $$(env | grep '^FRP_PROXY_' | sort | cut -d= -f2-); do
          name=$$(echo $$proxy | cut -d, -f1)
          type=$$(echo $$proxy | cut -d, -f2)
          localIP=$$(echo $$proxy | cut -d, -f3)
          localPort=$$(echo $$proxy | cut -d, -f4)
          remotePort=$$(echo $$proxy | cut -d, -f5)
          printf '\n[[proxies]]\nname = "%s"\ntype = "%s"\nlocalIP = "%s"\nlocalPort = %s\nremotePort = %s\n' \
            "$$name" "$$type" "$$localIP" "$$localPort" "$$remotePort" >> /tmp/frpc.toml
        done
        exec frpc -c /tmp/frpc.toml
    networks:
      - 1panel-network

networks:
  1panel-network:
    external: true
